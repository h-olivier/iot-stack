nodered:

  image: nodered/node-red:4.0.2

  container_name: nodered

  restart: unless-stopped

  ports:
  - "1880:1880"

  environment:
  - TZ=Europe/Paris

  volumes:
  - nodered_data:/data

  labels:
  - "traefik.enable=true"

  - "traefik.http.routers.nodered.rule=Host(`nodered.local`)"

  - "traefik.http.routers.nodered.entrypoints=websecure"

  - "traefik.http.routers.nodered.tls=true"

volumes:
  nodered_data:
