mysql:

  image: mysql:8.4

  container_name: mysql

  restart: unless-stopped

  ports:
  - "3306:3306"

  environment:
    MYSQL_ROOT_PASSWORD: root123

    MYSQL_DATABASE: iotdb

    MYSQL_USER: iotuser

    MYSQL_PASSWORD: iot123

  command: --default-authentication-plugin=mysql_native_password

  volumes:
  - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
